# Supabase local config — `bunx supabase init` puede regenerarlo si se necesita.
project_id = "deep-tech"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
# Auto-registro abierto (restringido a @deepcompany.com por el trigger
# handle_new_user, ver 0037): las cuentas nacen 'pendiente' hasta que un
# admin_rrhh las aprueba desde Usuarios. La invitación directa sigue existiendo.
enable_signup = true
[auth.mfa]
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

# verify_jwt = false para permitir el preflight CORS del navegador;
# la función valida la sesión y el rol admin internamente.
[functions.invite-user]
verify_jwt = false

[functions.send-service-order]
verify_jwt = false

[functions.reject-user]
verify_jwt = false
